<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helixnex Ads Track Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6fb;--card:rgba(255,255,255,.75);--card-solid:#ffffff;--border:rgba(15,23,42,.08);
  --text:#0f172a;--muted:#64748b;--soft:rgba(124,58,237,.08);--accent:#7c3aed;--accent-t:#6d28d9;
  --grad:linear-gradient(135deg,#7c3aed,#3b82f6);--red:#ef4444;--green:#10b981;--amber:#f59e0b;--blue:#3b82f6;
  --shadow:0 10px 30px -12px rgba(30,41,99,.18);--blob1:rgba(124,58,237,.18);--blob2:rgba(59,130,246,.16)
}
[data-theme=dark]{
  --bg:#0b1020;--card:rgba(22,28,52,.62);--card-solid:#141a33;--border:rgba(255,255,255,.08);
  --text:#e7eaf6;--muted:#8a93b2;--soft:rgba(124,58,237,.18);--accent-t:#a78bfa;
  --shadow:0 10px 40px -10px rgba(0,0,0,.6);--blob1:rgba(124,58,237,.30);--blob2:rgba(59,130,246,.22)
}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .4s,color .4s;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hidden{display:none!important}
.muted,.s{color:var(--muted)} .s{font-size:12px} .txt-red{color:var(--red)!important}
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-blobs span{position:absolute;width:44vw;height:44vw;border-radius:50%;filter:blur(90px);animation:drift 22s ease-in-out infinite alternate}
.bg-blobs span:nth-child(1){background:var(--blob1);top:-14vw;left:-10vw}
.bg-blobs span:nth-child(2){background:var(--blob2);bottom:-16vw;right:-8vw;animation-delay:-9s}
@keyframes drift{to{transform:translate(6vw,4vw) scale(1.12)}}

.boot{position:fixed;inset:0;display:grid;place-items:center;z-index:3}
.logo-mark{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 22px -6px rgba(124,58,237,.65);flex-shrink:0}
.boot .logo-mark,.logo-mark.big{width:60px;height:60px;font-size:24px;border-radius:18px}
.boot .logo-mark{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.7}}

/* Login */
#login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:430px;padding:42px 36px;text-align:center;animation:pop .7s cubic-bezier(.2,.9,.3,1.2)}
.login-card .logo-mark{margin:0 auto}
.login-card h2{font-size:24px;font-weight:800;margin:18px 0 6px;letter-spacing:-.02em}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:26px}
.login-card .input{width:100%;margin-bottom:12px;padding:14px}
.login-card .btn{width:100%;justify-content:center;padding:14px;font-size:14px}
.login-top{position:fixed;top:18px;right:18px;z-index:2}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:12px;line-height:1.5}
.ver{margin-top:14px;font-size:11px;color:var(--muted)}

/* Layout */
#app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:4px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border)}
.brand-logo{display:flex;align-items:center;gap:12px;padding:4px 10px 26px}
.logo-text b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.logo-text small{color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;transition:all .25s}
.nav a:hover{background:var(--soft);color:var(--text);transform:translateX(3px)}
.nav a.active{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(124,58,237,.75)}
.nav svg,.icon-btn svg{width:18px;height:18px;flex-shrink:0}
.badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;animation:bounce 1.6s infinite}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.side-foot{margin-top:auto;padding:14px;border-radius:14px;background:var(--soft);font-size:12px}
.side-foot b{display:block;font-size:13px;margin-bottom:2px}
main{flex:1;min-width:0;padding:24px 36px 48px}
.container{max-width:1700px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.topbar h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.topbar p{color:var(--muted);font-size:13px;margin-top:3px}
.top-actions{display:flex;gap:10px;align-items:center}
.role-pill{padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent-t)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center;transition:all .25s;flex-shrink:0;font-size:17px}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.theme-btn svg{animation:spin .5s ease}
@keyframes spin{from{transform:rotate(-120deg) scale(.4);opacity:0}}

/* Cards */
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s,outline-color .3s}
.card.hover:hover{transform:translateY(-4px)}
.card h3{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mt{margin-top:18px}
.kpi .label{color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .value{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.kpi .dot{width:8px;height:8px;border-radius:50%}
.kpi.red .value{color:var(--red)}
.note{margin:18px 0;padding:14px 18px;border-radius:14px;background:var(--soft);font-size:13px;border:1px solid var(--border)}

/* Buttons & inputs */
.btn{border:none;border-radius:12px;padding:10px 16px;font:600 13px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .25s;background:var(--soft);color:var(--accent-t);text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(124,58,237,.75)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.danger{background:rgba(239,68,68,.1);color:var(--red)}
.btn.ok{background:rgba(16,185,129,.12);color:var(--green)}
.input{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card-solid);color:var(--text);font:500 13px Inter,sans-serif;outline:none;transition:all .2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
textarea.input{resize:vertical;line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.spacer{flex:1}
.chips{display:inline-flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--border)}
.chip{padding:7px 14px;border-radius:9px;border:none;background:none;color:var(--muted);font:600 13px Inter,sans-serif;cursor:pointer;transition:all .2s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--grad);color:#fff}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions.nowrap{flex-wrap:nowrap}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--soft)}
tr.row-red td{background:rgba(239,68,68,.06)}
tr.row-red td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tlink{cursor:pointer;font-weight:700;color:var(--text);border-bottom:1px dashed var(--muted);transition:color .2s}
.tlink:hover{color:var(--accent-t);border-color:var(--accent-t)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.green{background:rgba(16,185,129,.13);color:var(--green)}
.pill.red{background:rgba(239,68,68,.12);color:var(--red)}
.pill.amber{background:rgba(245,158,11,.14);color:var(--amber)}
.pill.blue{background:rgba(59,130,246,.12);color:var(--blue)}
.pill.violet{background:var(--soft);color:var(--accent-t)}
.pill.gray{background:rgba(100,116,139,.12);color:var(--muted)}
.pill.live::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(1.7)}}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
img.avatar{object-fit:cover;background:var(--soft)}
.avatar.lg{width:64px;height:64px;font-size:20px;margin-bottom:12px}
.who{display:inline-flex;align-items:center;gap:8px}
.link{font-size:12px;color:var(--accent-t);text-decoration:none;background:var(--soft);padding:5px 10px;border-radius:8px;font-weight:600;transition:all .2s}
.link:hover{filter:brightness(1.15)}
.link.xs{font-size:11px;padding:2px 7px;margin-left:6px}

/* Brands */
.brand-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.brand-card .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand-card .grow{flex:1;min-width:0}
.brand-initial{width:52px;height:52px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0;transition:transform .3s}
.brand-initial.emo{background:var(--soft);font-size:28px}
.brand-card:hover .brand-initial{transform:rotate(-6deg) scale(1.08)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stat small{color:var(--muted);font-size:11px;display:block;margin-bottom:3px}
.stat b{font-size:15px}

/* Lists */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);border-radius:10px;transition:background .2s}
.list-item:last-child{border-bottom:none}
.list-item.click{cursor:pointer}
.list-item.click:hover{background:var(--soft)}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{max-height:340px;overflow:auto;padding-right:4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}

/* Team */
.members{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.member{cursor:pointer;text-align:center;outline:2px solid transparent}
.member.sel{outline-color:var(--accent)}
.member b{display:block;font-size:15px}
.member .avatar.lg{transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.member:hover .avatar.lg{transform:scale(1.1) rotate(-4deg)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px;font-size:11px;color:var(--muted)}
.mini b{font-size:17px;color:var(--text)}
.tl-day{margin-bottom:18px}
.tl-day h4{font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.tl-item{display:flex;gap:12px;padding:10px 12px;border-radius:12px;align-items:center;transition:background .2s;cursor:pointer}
.tl-item:hover{background:var(--soft)}
.tl-item.red{background:rgba(239,68,68,.07)}
.tl-item .grow{flex:1;min-width:0}
.tl-item .t{font-weight:600;font-size:13.5px}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sum-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.sum-row:last-child{border:none}

/* Project detail */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.dgrid>div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px}
.dgrid small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.sec-t{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.note-box{padding:14px 16px;border-radius:14px;background:var(--soft);border-left:3px solid var(--accent);font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.note-box.done{border-left-color:var(--green);background:rgba(16,185,129,.08)}

/* Pickers */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;max-height:260px;overflow:auto;padding:6px;border:1px solid var(--border);border-radius:14px;background:var(--card-solid)}
.pick.icons{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}
.pick label{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:12px;border:2px solid transparent;transition:all .2s}
.pick label:hover{background:var(--soft);transform:translateY(-2px)}
.pick label:has(input:checked){border-color:var(--accent);background:var(--soft);transform:scale(1.05)}
.pick input{display:none}
.pick img{width:50px;height:50px;border-radius:50%;background:var(--soft)}
.pick .emo{font-size:28px;line-height:1.2}
.pick small{font-size:10.5px;color:var(--muted);text-align:center}

/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:480px;padding:0;overflow:hidden}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.chat-body{flex:1;overflow-y:auto;padding:20px}
.mrow{display:flex;margin:6px 0}
.mrow.me{justify-content:flex-end}
.msg{max-width:min(68%,560px);padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;box-shadow:var(--shadow)}
.msg.them{background:var(--card-solid);border:1px solid var(--border);border-bottom-left-radius:6px}
.msg.me{background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.msg .from{font-size:11px;font-weight:700;color:var(--accent-t);margin-bottom:3px}
.msg .txt{white-space:pre-wrap;word-break:break-word}
.msg img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin:2px 0 6px;cursor:zoom-in}
.msg .time{font-size:10.5px;opacity:.75;margin-top:4px;text-align:right}
.day-sep{text-align:center;margin:16px 0 10px}
.day-sep span{font-size:11px;color:var(--muted);background:var(--soft);padding:4px 12px;border-radius:999px;font-weight:600}
.chat-preview{display:flex;align-items:center;gap:10px;padding:12px 20px 0}
.chat-preview img{height:72px;border-radius:10px;box-shadow:var(--shadow)}
.chat-input{display:flex;align-items:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
.chat-input textarea{flex:1;resize:none;max-height:140px;min-height:42px}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:30px;cursor:zoom-out;animation:fade .2s}
.lightbox img{max-width:100%;max-height:92vh;border-radius:14px;animation:pop .35s}

/* Modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.45);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s}
.modal-card{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--card-solid);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .4s cubic-bezier(.2,.9,.3,1.25)}
.modal-card h3{font-size:19px;font-weight:800}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label.fl{font-size:12px;font-weight:600;color:var(--muted)}
.field input[type=color]{height:42px;padding:4px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;bottom:24px;right:24px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--card-solid);border:1px solid var(--border);border-left:4px solid var(--green);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;font-weight:500;animation:slidein .4s cubic-bezier(.2,.9,.3,1.2)}
.toast.bad{border-left-color:var(--red)}
.toast.msgt{border-left-color:var(--accent);cursor:pointer}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}}

/* Motion */
.anim .fu{opacity:0;animation:fu .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0ms)}
.anim tbody tr{animation:fu .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms + 150ms)}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.readonly .mgr{display:none!important}

@media(max-width:1150px){.two,.half{grid-template-columns:1fr}}
@media(max-width:860px){
  #app{flex-direction:column}
  .sidebar{width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:5}
  .brand-logo,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap}
  main{padding:18px}
  .form-grid,.dgrid{grid-template-columns:1fr}
  .msg{max-width:85%}
}
@media print{
  .sidebar,.top-actions,.toolbar,.bg-blobs,.mgr{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .card{box-shadow:none;backdrop-filter:none;break-inside:avoid;border:1px solid #ddd}
}
</style>
</head>
<body>
<div class="bg-blobs"><span></span><span></span></div>
<div id="boot" class="boot"><div class="logo-mark">H</div></div>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="login-top"><button class="icon-btn theme-btn" title="Day / Night"></button></div>
  <div class="card login-card">
    <div class="logo-mark big">H</div>
    <h2>Helixnex Ads Track Portal</h2>
    <p>Sign in to continue</p>
    <form id="loginForm">
      <input class="input" id="lu" placeholder="Username (manager or ceo)" autocomplete="username" required />
      <input class="input" id="lp" type="password" placeholder="Password" autocomplete="current-password" required />
      <button class="btn primary" type="submit">Sign in</button>
      <div class="err" id="lerr"></div>
    </form>
    <div class="ver">v3</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar">

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const z = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0,7);
const nowLocal = () => { const d=new Date(); return `${ymd(d)}T${z(d.getHours())}:${z(d.getMinutes())}`; };
const money = n => new Intl.NumberFormat("en-US",{style:"currency",currency:CURRENCY,maximumFractionDigits:0}).format(Number(n)||0);
const fmtD = s => s ? new Date(s.length>10 ? s : s+"T00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const fmtDT = s => s ? new Date(s).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "—";

/* ---------- status logic ---------- */
function pStatus(p){
  const t = today();
  if (p.completedDate) return p.dueDate && p.completedDate > p.dueDate ? {k:"late",label:"Done late",c:"red"} : {k:"done",label:"Done on time",c:"green"};
  if (p.dueDate && p.dueDate < t) return {k:"overdue",label:"Overdue",c:"red"};
  if (p.dueDate === t) return {k:"today",label:"Due today",c:"amber"};
  return {k:"active",label:p.status||"In progress",c:"blue"};
}
const isRed = p => ["late","overdue"].includes(pStatus(p).k);
const DAY = 864e5;
const rDue = r => new Date(new Date(r.requestedAt).getTime() + DAY);
function rStatus(r){
  if (!r.requestedAt) return {k:"open",label:"—",c:"gray"};
  const due = rDue(r);
  if (r.completedAt) return new Date(r.completedAt) > due ? {k:"late",label:"Done late",c:"red"} : {k:"done",label:"Done in 24h",c:"green"};
  const left = due - Date.now();
  if (left < 0) return {k:"overdue",label:"Overdue",c:"red"};
  const h=Math.floor(left/36e5), m=Math.floor(left%36e5/6e4);
  return {k:"open",label:`${h}h ${m}m left`,c:h<4?"amber":"blue"};
}
function rangeStart(r){
  const d=new Date(); d.setHours(0,0,0,0);
  if (r==="today") return ymd(d);
  if (r==="week"){ d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }
  if (r==="month") return ymd(d).slice(0,8)+"01";
  return "0000-00-00";
}
function brandMonth(b,m){
  const paid = sum(S.payments.filter(x=>x.brandId===b.id && inMonth(x.date,m)), x=>x.amount);
  const deliv = S.projects.filter(p=>p.brandId===b.id && inMonth(p.completedDate,m));
  const active = (b.status||"Active")==="Active";
  const billed = b.paymentType==="monthly" ? (active ? Number(b.monthlyFee)||0 : 0) : sum(deliv,p=>p.price);
  return { paid, delivered:deliv.length, billed, due:Math.max(billed-paid,0) };
}
function memberStats(id){
  const ps=S.projects.filter(p=>p.assigneeId===id);
  const done=ps.filter(p=>p.completedDate);
  const late=done.filter(p=>p.dueDate && p.completedDate>p.dueDate).length;
  const revs=S.revisions.filter(r=>r.assigneeId===id);
  return { active:ps.filter(p=>!p.completedDate).length, done:done.length, late,
    overdue:ps.filter(p=>pStatus(p).k==="overdue").length, revs:revs.length,
    revLate:revs.filter(r=>["late","overdue"].includes(rStatus(r).k)).length,
    rate: done.length ? Math.round((done.length-late)/done.length*100) : null };
}
function memberEvents(id){
  const ev=[];
  S.projects.filter(p=>p.assigneeId===id).forEach(p=>{
    const b=brandText(p.brandId);
    if (p.assignedDate) ev.push({pid:p.id,date:p.assignedDate,c:"var(--blue)",t:`Assigned: ${p.title}`,s:`${b} · ${p.type||""} · due ${fmtD(p.dueDate)}`});
    if (p.completedDate){ const late=p.dueDate && p.completedDate>p.dueDate; ev.push({pid:p.id,date:p.completedDate,c:late?"var(--red)":"var(--green)",t:`${late?"Delivered late":"Delivered"}: ${p.title}`,s:`${b} · was due ${fmtD(p.dueDate)}${p.doneNote?" · 📝 "+p.doneNote:""}`,red:late}); }
    else if (pStatus(p).k==="overdue") ev.push({pid:p.id,date:today(),c:"var(--red)",t:`Overdue: ${p.title}`,s:`${b} · was due ${fmtD(p.dueDate)}`,red:true});
  });
  S.revisions.filter(r=>r.assigneeId===id && r.requestedAt).forEach(r=>{
    const p=find("projects",r.projectId);
    ev.push({pid:r.projectId,date:r.requestedAt.slice(0,10),c:"var(--amber)",t:`Revision requested: ${p?.title||"—"}`,s:r.notes||"Client asked for changes"});
    if (r.completedAt){ const late=rStatus(r).k==="late"; ev.push({pid:r.projectId,date:r.completedAt.slice(0,10),c:late?"var(--red)":"var(--green)",t:`Revision ${late?"done late":"done"}: ${p?.title||"—"}`,s:`Deadline was ${fmtDT(rDue(r))}`,red:late}); }
  });
  return ev.sort((a,b)=>b.date.localeCompare(a.date));
}

/* ---------- UI state ---------- */
const UI = { projTab:"active", projBrand:"", projMember:"", projQ:"", revTab:"open", member:null, range:"week", expMonth:thisMonth(), repMonth:thisMonth(), chatDraft:"", chatImg:"" };

const kpi = (label,val,color,isMoney,i,cls="") => `<div class="card kpi hover fu ${cls}" style="--d:${i*60}ms"><div class="label"><span class="dot" style="background:${color}"></span>${label}</div><div class="value" data-count="${val}" ${isMoney?"data-money":""}>${isMoney?money(val):val}</div></div>`;

/* ---------- PAGES ---------- */
function pgDashboard(){
  const m=thisMonth(), t=today(), in7=ymd(new Date(Date.now()+7*DAY));
  const inc=sum(S.payments.filter(x=>inMonth(x.date,m)),x=>x.amount);
  const exp=sum(S.expenses.filter(x=>inMonth(x.date,m)),x=>x.amount);
  const overP=S.projects.filter(p=>pStatus(p).k==="overdue");
  const overR=S.revisions.filter(r=>rStatus(r).k==="overdue");
  const od=overP.length+overR.length;
  const odItems=[...overP.map(p=>({id:p.id,t:p.title,s:`${brandText(p.brandId)} · was due ${fmtD(p.dueDate)}`,w:p.assigneeId,right:`<span class="pill red live">Project</span>`})),
                 ...overR.map(r=>({id:r.projectId,t:find("projects",r.projectId)?.title||"Revision",s:`Revision deadline ${fmtDT(rDue(r))}`,w:r.assigneeId,right:`<span class="pill red live">Revision</span>`}))];
  const soon=S.projects.filter(p=>!p.completedDate && p.dueDate>=t && p.dueDate<=in7).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const doneToday=[...S.projects.filter(p=>p.completedDate===t).map(p=>({id:p.id,t:p.title,s:`Delivered · ${brandText(p.brandId)}${p.doneNote?" · 📝":""}`,w:p.assigneeId,right:pill(pStatus(p))})),
                   ...S.revisions.filter(r=>inMonth(r.completedAt,t)).map(r=>({id:r.projectId,t:find("projects",r.projectId)?.title||"Revision",s:"Revision completed",w:r.assigneeId,right:pill(rStatus(r))}))];
  return `
  <div class="grid kpis">
    ${kpi("Income this month",inc,"var(--green)",1,0)}
    ${kpi("Expenses this month",exp,"var(--amber)",1,1)}
    ${kpi("Net profit",inc-exp,"var(--accent)",1,2,inc-exp<0?"red":"")}
    ${kpi("Active brands",S.brands.filter(b=>(b.status||"Active")==="Active").length,"var(--blue)",0,3)}
    ${kpi("Active projects",S.projects.filter(p=>!p.completedDate).length,"#06b6d4",0,4)}
    ${kpi("Overdue now",od,"var(--red)",0,5,od?"red":"")}
  </div>
  <div class="grid two mt">
    <div class="card fu" style="--d:320ms"><h3>Income vs expenses <span class="s">last 6 months</span></h3><div style="height:310px"><canvas id="chMain"></canvas></div></div>
    <div class="card fu" style="--d:380ms"><h3>Overdue ${od?`<span class="pill red">${od}</span>`:""}</h3><div class="scroll">${odItems.length?odItems.map(listItem).join(""):`<div class="empty">Nothing overdue. Great work! 🎉</div>`}</div></div>
  </div>
  <div class="grid half mt">
    <div class="card fu" style="--d:440ms"><h3>Due in the next 7 days</h3><div class="scroll">${soon.length?soon.map(p=>listItem({id:p.id,t:p.title,s:`${brandText(p.brandId)} · ${p.type||""}`,w:p.assigneeId,right:p.dueDate===t?`<span class="pill amber">Today</span>`:`<span class="pill blue">${fmtD(p.dueDate)}</span>`})).join(""):`<div class="empty">No deadlines this week.</div>`}</div></div>
    <div class="card fu" style="--d:500ms"><h3>Done today</h3><div class="scroll">${doneToday.length?doneToday.map(listItem).join(""):`<div class="empty">Nothing delivered yet today.</div>`}</div></div>
  </div>`;
}
function chartDashboard(){
  if (!window.Chart) return;
  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return ymd(d).slice(0,7);});
  const mi=m=>sum(S.payments.filter(x=>inMonth(x.date,m)),x=>x.amount);
  const me=m=>sum(S.expenses.filter(x=>inMonth(x.date,m)),x=>x.amount);
  makeChart("chMain",{type:"bar",data:{labels:months.map(monthLabel),datasets:[
    {label:"Income",data:months.map(mi),backgroundColor:"#7c3aed",borderRadius:8,maxBarThickness:34},
    {label:"Expenses",data:months.map(me),backgroundColor:"#3b82f6",borderRadius:8,maxBarThickness:34},
    {type:"line",label:"Profit",data:months.map(m=>mi(m)-me(m)),borderColor:"#10b981",backgroundColor:"#10b981",tension:.4,pointRadius:4}
  ]},options:chartOpts()});
}

function pgBrands(){
  const m=thisMonth();
  const brands=[...S.brands].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const cards=brands.map((b,i)=>{
    const bm=brandMonth(b,m), pc=S.projects.filter(p=>p.brandId===b.id), act=pc.filter(p=>!p.completedDate).length;
    const st=b.status||"Active";
    return `<div class="card hover brand-card fu" style="--d:${i*50}ms">
      <div class="top">${b.icon?`<div class="brand-initial emo">${esc(b.icon)}</div>`:`<div class="brand-initial">${esc(initials(b.name))}</div>`}
        <div class="grow"><b>${esc(b.name)}</b><div class="s">${esc(b.contact||"")}</div></div>
        <span class="pill ${st==="Active"?"green":st==="Paused"?"amber":"gray"}">${esc(st)}</span></div>
      <span class="pill ${b.paymentType==="monthly"?"violet":"blue"}">${b.paymentType==="monthly"?"Monthly fixed · "+money(b.monthlyFee):"Per project"}</span>
      <div class="links">${b.website?`<a class="link" href="${esc(url(b.website))}" target="_blank" rel="noopener">Website ↗</a>`:""}${b.loginUrl?`<a class="link" href="${esc(url(b.loginUrl))}" target="_blank" rel="noopener">Login ↗</a>`:""}</div>
      <div class="stats"><div class="stat"><small>Paid this month</small><b>${money(bm.paid)}</b></div>
        <div class="stat"><small>Balance due</small><b class="${bm.due>0?"txt-red":""}">${money(bm.due)}</b></div>
        <div class="stat"><small>Projects</small><b>${act} active</b> <span class="s">/ ${pc.length}</span></div></div>
      <div class="actions mgr"><button class="btn sm ok" data-act="addPayment" data-id="${b.id}">+ Payment</button><button class="btn sm ghost" data-act="editBrand" data-id="${b.id}">Edit</button><button class="btn sm danger" data-act="delBrand" data-id="${b.id}">Delete</button></div>
    </div>`;}).join("");
  const pays=[...S.payments].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,60);
  return `<div class="toolbar"><div class="spacer"></div><button class="btn mgr" data-act="addPayment">+ Record payment</button><button class="btn primary mgr" data-act="addBrand">+ Add brand</button></div>
  <div class="grid brand-grid">${cards||`<div class="card empty">No brands yet. Add your first brand.</div>`}</div>

function updateBadge(){
  const n=S.messages.filter(m=>m.from!==role && !m.read).length;
  const b=$("#msgBadge"); b.textContent=n; b.classList.toggle("hidden",!n || route==="messages");

function countUp(){
  document.querySelectorAll("#view [data-count]").forEach(el=>{
    const target=Number(el.dataset.count)||0, isM=el.hasAttribute("data-money"), t0=performance.now(), dur=900;
    const step=t=>{const p=Math.min((t-t0)/dur,1), v=target*(1-Math.pow(1-p,3)); el.textContent=isM?money(v):Math.round(v); if (p<1) requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
function render(anim){
  if (!role) return;
  const view=$("#view"), ae=document.activeElement;
  const fid=ae && view.contains(ae) ? ae.id : null, sel=fid && ae.selectionStart!=null ? ae.selectionStart : null;
  const cbOld=$("#chatBody"), stick=!cbOld || (cbOld.scrollHeight-cbOld.scrollTop-cbOld.clientHeight<80), oldTop=cbOld?.scrollTop||0;
  charts.forEach(c=>c.destroy()); charts=[];

    else if (fd.t==="textarea") input=`<textarea class="input" name="${fd.n}" rows="${fd.rows||3}">${esc(v)}</textarea>`;
    else if (fd.t==="pick") input=`<div class="pick ${fd.cls||""}">${fd.o.map(([ov,oh])=>`<label title="${esc(ov)}"><input type="radio" name="${fd.n}" value="${esc(ov)}" ${String(ov)===String(v)?"checked":""}>${oh}</label>`).join("")}</div>`;
    else input=`<input class="input" type="${fd.t||"text"}" name="${fd.n}" value="${esc(v)}" ${fd.req?"required":""} ${fd.t==="number"?'step="any" min="0"':""} ${fd.list?`list="dl_${fd.n}" autocomplete="off"`:""}>${fd.list?`<datalist id="dl_${fd.n}">${fd.list.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:""}`;

function compressImage(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height; const max=1280;
      if (w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      let q=.82, d=c.toDataURL("image/jpeg",q);
      while (d.length>700000 && q>.3){ q-=.1; d=c.toDataURL("image/jpeg",q); }
      URL.revokeObjectURL(img.src);
      d.length>900000 ? rej(new Error("Image too large")) : res(d);
    };
    img.onerror=()=>rej(new Error("Could not read image"));
    img.src=URL.createObjectURL(file);
  });
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if (e.target.closest("#lightbox")) return $("#lightbox").classList.add("hidden");
  if (e.target.closest("[data-close]") || e.target.id==="modal") return closeModal();
  if (e.target.closest(".theme-btn")) return setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

  if (chip){ UI[chip.dataset.ui]=chip.dataset.val; return render(false); }
  const b=e.target.closest("[data-act]"); if (!b) return;
  const a=b.dataset.act;
  if (!OPEN_ACTS.includes(a) && role!=="manager") return toast("This account is view only",true);

});
$("#view").addEventListener("input",e=>{

$("#view").addEventListener("change",async e=>{

function notifyMsg(m){
  const from=m.from==="ceo"?"CEO":"Manager", body=m.text||"📷 Sent an image";
  if (route!=="messages") toast(`💬 ${from}: ${body.slice(0,80)}`,false,"msgt",()=>{ location.hash="#/messages"; });
  if (document.hidden && "Notification" in window && Notification.permission==="granted"){
    try{ const n=new Notification(`New message from ${from}`,{body:body.slice(0,120)}); n.onclick=()=>{ window.focus(); location.hash="#/messages"; }; }catch{}

/* ---------- auth ---------- */
$("#loginForm").onsubmit=async e=>{
  e.preventDefault();
  const u=$("#lu").value.trim().toLowerCase();
  const email=u.includes("@")?u:(USERS[u]||`${u}@helixnex.com`);
  const btn=e.submitter; btn.disabled=true; btn.textContent="Signing in…"; $("#lerr").textContent="";
  try{ await signInWithEmailAndPassword(auth,email,$("#lp").value); }
  catch(err){ $("#lerr").textContent=/invalid|wrong|not-found|credential/.test(err.code||"")?"Wrong username or password.":(err.message||"Sign in failed"); }
  finally{ btn.disabled=false; btn.textContent="Sign in"; }
};
onAuthStateChanged(auth,user=>{
  $("#boot").classList.add("hidden");
  unsubs.forEach(u=>u()); unsubs=[]; seenMsg.clear(); pendingRead.clear();
  if (!user){ role=null; $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); return; }
  const email=(user.email||"").trim().toLowerCase();
  role = email===MANAGER_EMAIL.toLowerCase()?"manager":email===CEO_EMAIL.toLowerCase()?"ceo":null;
  if (!role){
    signOut(auth);
    $("#lerr").textContent=`Signed in as "${email}", but the portal only allows ${MANAGER_EMAIL} and ${CEO_EMAIL}.`;
    return;
  }
  document.body.classList.toggle("readonly",role!=="manager");
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#rolePill").textContent = role==="manager"?"● Manager · full access":"● CEO · view only";
  $("#meRole").textContent = role==="manager"?"Manager":"CEO";
  $("#meEmail").textContent = email;
  route=getRoute();
  $("#view").innerHTML=`<div class="empty">Loading data…</div>`;
  const loaded=new Set();
  COLS.forEach(c=>{
    const ref = c==="messages" ? query(collection(db,c),orderBy("clientTs","desc"),limit(300)) : collection(db,c);
    unsubs.push(onSnapshot(ref,snap=>{
      const first=!loaded.has(c);
      S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if (c==="messages"){
        S.messages.sort((a,b)=>(a.clientTs||0)-(b.clientTs||0));
        if (first) S.messages.forEach(m=>seenMsg.add(m.id));
        else snap.docChanges().forEach(ch=>{ if (ch.type==="added"){ const d=ch.doc.data(); if (d.from!==role) notifyMsg(d); } });
      }
      if (loaded.size<COLS.length){ loaded.add(c); if (loaded.size===COLS.length) render(true); }
      else scheduleRender();
    },err=>{
      $("#view").innerHTML=`<div class="card empty">Can't read the database (${esc(err.code)}). Check that the Firestore rules were published.</div>`;
    }));
  });
});
